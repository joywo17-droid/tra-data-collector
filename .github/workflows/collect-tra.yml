name: collect-tra

# 每 15 分鐘啟動一次；每次啟動後在容器內連續輪詢 14 分鐘。
# 這樣取樣密度是 60 秒一次，但一天只有約 96 次 workflow。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # 允許在網頁上手動按按鈕試跑

# 允許多個執行同時進行（排程延遲時會重疊），檔名以 run id 區隔，不會互相覆蓋
concurrency:
  group: collect-tra-${{ github.run_id }}

permissions:
  contents: write           # 需要寫入權限才能把資料 commit 回 repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests

      - name: 採集 14 分鐘
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          python collect.py \
            --outdir ./raw \
            --duration 840 \
            --liveboard-interval 60 \
            --alert-interval 300 \
            --tag "${{ github.run_id }}"

      - name: 確認有資料才繼續
        id: check
        run: |
          if [ -z "$(find ./raw -name '*.jsonl.gz' -size +0 2>/dev/null)" ]; then
            echo "本次沒有產生資料，跳過 commit"
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=true" >> "$GITHUB_OUTPUT"
            find ./raw -name '*.jsonl.gz' -exec ls -la {} \;
          fi

      - name: 提交資料
        if: steps.check.outputs.has_data == 'true'
        run: |
          git config user.name  "collector"
          git config user.email "collector@users.noreply.github.com"
          git add raw/
          git commit -m "data: $(date -u '+%Y-%m-%dT%H:%MZ') run ${{ github.run_id }}" || exit 0
          # 排程重疊時可能有人先推，重試幾次
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失敗，第 $i 次重試"
            git pull --rebase --autostash
            sleep $((i * 5))
          done
          echo "::error::推送重試五次仍失敗"
          exit 1
